<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chain Insights – Fund Flow Graph</title>
<style>
  /* Chain Insights Design Tokens — inlined from src/mcp_server/assets/brand.css */
  :root {
    --background-color: rgba(24, 24, 26, 1);
    --background-color-2: rgba(10, 12, 17, 1);
    --sidebar-color: rgba(19, 19, 24, 1);
    --black: rgba(23, 23, 24, 1);
    --white-1000: rgba(255, 255, 255, 1);
    --white-900: rgba(255, 255, 255, 0.9);
    --white-800: rgba(255, 255, 255, 0.8);
    --white-700: rgba(255, 255, 255, 0.7);
    --white-600: rgba(255, 255, 255, 0.6);
    --white-500: rgba(255, 255, 255, 0.5);
    --white-400: rgba(255, 255, 255, 0.4);
    --white-300: rgba(255, 255, 255, 0.3);
    --white-200: rgba(255, 255, 255, 0.2);
    --white-100: rgba(255, 255, 255, 0.1);
    --white-60: rgba(255, 255, 255, 0.06);
    --white-50: rgba(255, 255, 255, 0.05);
    --white-40: rgba(255, 255, 255, 0.04);
    --white-20: rgba(255, 255, 255, 0.02);
    --gold-1000: #f2dda6;
    --gold-400: rgba(242, 221, 166, 0.4);
    --gold-300: rgba(242, 221, 166, 0.3);
    --gold-200: rgba(242, 221, 166, 0.2);
    --gold-100: rgba(242, 221, 166, 0.1);
    --gold-50: rgba(242, 221, 166, 0.05);
    --gold-dark-1000: #ae9d71;
    --red-error: #eb4f4f;
    --yellow: #ebeb4f;
    --green: #4feb69;
    --sidebar: #131318;
    --font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --font-weight-regular: 400;
    --font-weight-medium: 500;
    --font-weight-semibold: 600;
    --font-weight-bold: 700;
  }
  *, *::after, *::before { box-sizing: border-box; padding: 0; margin: 0; }
  ::-webkit-scrollbar { background: transparent; width: 8px; }
  ::-webkit-scrollbar-thumb { border-radius: 99px; background: var(--white-100); }

  body {
    background: var(--background-color-2);
    overflow: hidden;
    height: 100vh;
    width: 100vw;
  }

  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    cursor: grab;
  }
  canvas.dragging { cursor: grabbing; }

  #open-in-browser {
    position: absolute;
    top: 16px;
    left: 16px;
    z-index: 10;
  }
  #open-in-browser a {
    display: inline-block;
    background: var(--sidebar-color);
    border: 1px solid var(--white-60);
    border-radius: 8px;
    padding: 6px 14px;
    font: 500 12px/1 var(--font-family);
    color: var(--gold-1000);
    cursor: pointer;
    text-decoration: none;
    transition: color .15s, background .15s;
  }
  #open-in-browser a:hover {
    background: var(--white-60);
    color: var(--white-1000);
  }
  #controls {
    position: absolute;
    top: 16px;
    right: 16px;
    display: flex;
    gap: 4px;
    z-index: 10;
  }
  .ctrl-btn {
    background: var(--sidebar-color);
    border: 1px solid var(--white-60);
    border-radius: 8px;
    padding: 6px 14px;
    font: 500 12px/1 var(--font-family);
    color: var(--white-400);
    cursor: pointer;
    user-select: none;
    transition: color .15s, background .15s;
    letter-spacing: 0.02em;
  }
  .ctrl-btn:hover { color: var(--white-700); background: rgba(26,26,34,0.95); }
  .ctrl-btn.active { color: var(--gold-1000); }

  #loading {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    color: var(--gold-1000); font: 13px var(--font-family);
    z-index: 30; letter-spacing: 0.02em;
  }
  #loading.hidden { display: none; }
  #loading.error {
    color: var(--red-error);
    background: rgba(235, 79, 79, 0.08);
    border-radius: 8px;
    border: 1px solid rgba(235, 79, 79, 0.2);
    margin: 16px;
    padding: 16px;
    font-size: 13px;
  }
  #legend {
    position: absolute;
    bottom: 16px;
    left: 16px;
    z-index: 10;
    background: rgba(19, 19, 24, 0.85);
    border: 1px solid var(--white-60);
    border-radius: 8px;
    padding: 10px 14px;
    display: none;
  }
  #legend .legend-title {
    font: 500 11px/1 var(--font-family);
    color: var(--white-500);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  #legend .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 5px;
  }
  #legend .legend-item:last-child { margin-bottom: 0; }
  #legend .legend-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  #legend .legend-label {
    font: 400 11px/1 var(--font-family);
    color: var(--white-700);
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="open-in-browser" style="display:none"><a id="browser-link" href="#" target="_blank">Open in browser ↗</a></div>
<div id="controls">
  <button class="ctrl-btn layout-btn" data-layout="force" title="Gravity / force-directed layout">Force</button>
  <button class="ctrl-btn layout-btn active" data-layout="tree">Tree</button>
  <span style="width:1px;height:20px;background:var(--white-100);margin:0 4px"></span>
  <button class="ctrl-btn" id="reset-btn" title="Reset node positions">Reset</button>
</div>
<div id="legend"></div>
<div id="loading">Loading graph…</div>

function switchPalette(name) {
  var p = PALETTES[name];
  if (!p) return;
  ROLE_FILLS = p.roleFills;
  RISK_BORDERS = p.riskBorders;
  DEFAULT_NODE = p.defaultNode;
  document.querySelectorAll('.pal-btn').forEach(function(b){b.classList.toggle('active',b.dataset.palette===name);});
  if (graphData) { buildLegend(); draw(); }
}

/* ───────────────────────────────────────────────────────────
   Helpers
   ─────────────────────────────────────────────────────────── */
function trunc(a) { return (!a||a.length<=14) ? (a||'') : a.slice(0,6)+'…'+a.slice(-6); }
function fmtDate(ts) {
  var d = new Date(ts);
  return d.toISOString().slice(0,10) + ' ' + d.toISOString().slice(11,16);
}
function hashString(s) {
  var h = 2166136261;
  for (var i=0; i<s.length; i++) {
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return (h >>> 0).toString(36);
}
function storageIdFromData(data) {
  if (!data) return null;
  var meta = data.metadata || {};
  var explicit = meta.storage_id || meta.storageId || meta.trace_id || meta.traceId || meta.job_id || meta.jobId || meta.case_id || meta.caseId;
  if (explicit) return String(explicit).replace(/[^a-zA-Z0-9_.-]/g, '_');

  var nodeIds = (data.nodes || []).map(function(n){ return n.address || n.id || ''; }).sort();
  var edgeIds = (data.edges || []).map(function(e){
    return [e.from_address || e.from || '', e.to_address || e.to || '', e.type || 'FLOWS_TO'].join('>');
  }).sort();
  var basis = JSON.stringify({
    network: meta.network || '',
    seed: meta.seed_address || meta.seedAddress || '',
    nodes: nodeIds,
    edges: edgeIds,
  });
  return 'inline_' + hashString(basis);
}
function posStorageKey() {
  if (!storageId) return null;
  return 'graph_pos_' + storageId + '_' + layout;
}
function savePositions() {
  var key = posStorageKey();
  if (!key || !nodes.length) return;
  var pos = {};
  for (var i=0; i<nodes.length; i++) {
    pos[nodes[i].address] = {x:nodes[i].x, y:nodes[i].y};
  }
  try { localStorage.setItem(key, JSON.stringify(pos)); } catch(e) {}
}
function loadPositions() {
  var key = posStorageKey();
  if (!key) return false;
  try {
    var stored = localStorage.getItem(key);
    if (!stored) return false;
    var pos = JSON.parse(stored);
    var applied = 0;
    for (var i=0; i<nodes.length; i++) {
      var p = pos[nodes[i].address];
      if (p) { nodes[i].x = p.x; nodes[i].y = p.y; applied++; }
    }
    return applied > 0;
  } catch(e) { return false; }
}
function clearPositions() {
  // Clear all keys for this storageId
  if (!storageId) return;
  var prefix = 'graph_pos_' + storageId + '_';
  try {
    var keys = [];
    for (var i=0; i<localStorage.length; i++) {
      var k = localStorage.key(i);
      if (k && k.indexOf(prefix) === 0) keys.push(k);
    }
    keys.forEach(function(k){ localStorage.removeItem(k); });
  } catch(e) {}
}
function saveViewState() {
  if (!storageId) return;
  try { localStorage.setItem('graph_view_' + storageId, JSON.stringify({layout:layout})); } catch(e) {}
}
function loadViewState() {
  if (!storageId) return;
  try {
    var s = localStorage.getItem('graph_view_' + storageId);
    if (!s) return;
    var v = JSON.parse(s);
    if (v.layout) layout = v.layout;
    document.querySelectorAll('.layout-btn').forEach(function(b){ b.classList.toggle('active', b.dataset.layout===layout); });
  } catch(e) {}
}
function fmtUSD(v) {
  if (v==null) return '';
  if (v>=1e6) return '$'+(v/1e6).toFixed(1)+'M';
  if (v>=1e3) return '$'+(v/1e3).toFixed(1)+'K';
  return '$'+Math.round(v);
}

function bootWorker() {
  if (worker) worker.terminate();
  worker = new Worker(URL.createObjectURL(new Blob([WC],{type:'application/javascript'})));
  worker.onmessage = onWorkerMsg;
  worker.onerror = function(e) { console.error('Worker error:', e.message, 'line:', e.lineno); };
}

var needFit = true;
function onWorkerMsg(e) {
  applyPos(e.data.nodes);
  // Try loading saved positions; if none, save initial positions
  if (!loadPositions()) {
    savePositions();
  }
  draw();
  if (needFit) { needFit = false; requestAnimationFrame(fitView); }
}

function applyPos(wn) {
  for (var i=0;i<wn.length;i++) {
    var n = nodeMap[wn[i].address];
    if (n) { n.x=wn[i].x; n.y=wn[i].y; n.r=wn[i]._r||DEF_R; }
  }
}

function loadGraph(data) {
  graphData = data;
  seed = data.metadata ? data.metadata.seed_address : null;

  // Extract storageId from data_url query param for localStorage; fall back
  // to a deterministic graph hash so inline MCP/CLI app_data also persists.
  var params = new URLSearchParams(window.location.search);
  var dataUrl = params.get('data_url');
  if (dataUrl) {
    var m = dataUrl.match(/results\/([^/]+\/[^/]+)/);
    storageId = m ? m[1].replace(/\//g, '_') : null;
  }
  if (!storageId) storageId = storageIdFromData(data);

  // Build deposit→exchange name mapping
  depositExchange = {};
  var exMap = {};
  for (var ei2=0; ei2<data.nodes.length; ei2++) {
    var en = data.nodes[ei2];
    if (en.role === 'exchange' && en.labels && en.labels.length) {
      exMap[en.address] = en.labels[0].replace(/, ?exchange$/i, '');
    }
  }
  for (var di=0; di<data.edges.length; di++) {
    var de = data.edges[di];
    var df = de.from_address || de.from;
    var dt = de.to_address || de.to;
    if (exMap[dt]) depositExchange[df] = exMap[dt];
  }

  // Restore view state from localStorage (layout only).
  loadViewState();

  applyDataMode();
}

  amtRange = amtExt ? amtExt[1]-amtExt[0] : 0;

  var validEdges = graphData.edges.filter(function(e) {
    return nodeMap[e.from_address||e.from] && nodeMap[e.to_address||e.to];
  });

  needFit = true;
  worker.postMessage({type:'init', nodes:graphData.nodes.slice(), edges:validEdges,
    layout:layout, width:W, height:H, seed:seed});
  buildLegend();
}

function buildLegend() {
  var el = document.getElementById('legend');
  var roles = {}, risks = {};
  for (var i = 0; i < nodes.length; i++) {
    var n = nodes[i];
    if (n.role && ROLE_FILLS[n.role]) roles[n.role] = ROLE_FILLS[n.role];
    if (n.risk_level && RISK_BORDERS[n.risk_level]) risks[n.risk_level] = RISK_BORDERS[n.risk_level];
  }
  var ROLE_LABELS = {
    search:'Search address', seed:'Seed address', source:'Source', target:'Target',
    victim:'Victim', scammer:'Scammer', exchange:'Exchange', deposit:'Deposit',
    intermediary:'Intermediary', counterparty:'Counterparty'
  };
  var hasRoles = Object.keys(roles).length > 0;
  if (!hasRoles) { el.style.display='none'; return; }
  var html = '<div class="legend-title">Role</div>';
  for (var r in roles) {
    html += '<div class="legend-item"><div class="legend-dot" style="background:'+roles[r]+'"></div><span class="legend-label">'+(ROLE_LABELS[r]||r)+'</span></div>';
  }
  el.innerHTML = html;
  el.style.display = 'block';
}

/* ───────────────────────────────────────────────────────────
   Canvas
   ─────────────────────────────────────────────────────────── */
function initCanvas() {
  canvas = document.getElementById('c');
  dpr = window.devicePixelRatio || 1;
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx = canvas.getContext('2d');
  tf = d3.zoomIdentity;
}

/* ───────────────────────────────────────────────────────────
   Drawing — webapp useNetworkChart.js conventions:
   • ALL edges: valueColor gradient, solid, arrows
   • ALL nodes: valueColor gradient by size
   • Seed: bright gold + red ring
   ─────────────────────────────────────────────────────────── */
function draw() {
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle = COL_BG;
  ctx.fillRect(0,0,W,H);
  if (bgPatternImg) {
    var scale = Math.max(W/bgPatternImg.width, H/bgPatternImg.height);
    ctx.globalAlpha = 0.4;
    ctx.drawImage(bgPatternImg, 0, 0, bgPatternImg.width*scale, bgPatternImg.height*scale);
    ctx.globalAlpha = 1;
  }
  ctx.setTransform(tf.k*dpr,0,0,tf.k*dpr, tf.x*dpr, tf.y*dpr);
  drawEdges();
  drawNodes();
}

function drawEdges() {
  ctx.save();
  ctx.setLineDash([]);

  // Pre-compute curve offsets for parallel edges between same node pairs
  var pairCount = {};
  var pairIndex = {};
  for (var pi=0; pi<links.length; pi++) {
    var pl = links[pi];
    if (!pl.source || !pl.target) continue;
    // Use sorted pair key so A→B and B→A share the same group
    var pa = pl.source.address, pb = pl.target.address;
    var pairKey = pa < pb ? pa+'|'+pb : pb+'|'+pa;
    if (!pairCount[pairKey]) pairCount[pairKey] = 0;
    pairIndex[pi] = pairCount[pairKey];
    pairCount[pairKey]++;
  }

  // Draw pattern edges first (behind flow edges)
  for (var pass=0; pass<2; pass++) {
  for (var i=0; i<links.length; i++) {
    var l = links[i];
    var s = l.source, t = l.target;
    if (!s || !t) continue;
    var isPattern = l.type !== 'FLOWS_TO' && l.type !== 'TRANSFER';
    if (isPattern) continue;  // skip pattern edges entirely
    // Pass 0: behind, Pass 1: on top (only flow/transfer now)
    if (pass === 0) continue;

    var dx = t.x-s.x, dy = t.y-s.y;
    var dist = Math.sqrt(dx*dx+dy*dy) || 1;
    var rT = t.r || DEF_R;

    // Compute curve offset for parallel edges
    var pa2 = s.address, pb2 = t.address;
    var pairKey2 = pa2 < pb2 ? pa2+'|'+pb2 : pb2+'|'+pa2;
    var totalInPair = pairCount[pairKey2] || 1;
    var idxInPair = pairIndex[i] || 0;
    var curveOff = 0;
    if (totalInPair > 1) {
      curveOff = (idxInPair - (totalInPair-1)/2) * 20;
    }
    // Perpendicular offset direction
    var nx = -dy/dist, ny = dx/dist;
    var cpx = (s.x+t.x)/2 + nx*curveOff;
    var cpy = (s.y+t.y)/2 + ny*curveOff;

    // Arrow endpoint on curve near target
    var tt = 1 - (rT+7)/dist;
    if (tt < 0.5) tt = 0.5;
    var ex = (1-tt)*(1-tt)*s.x + 2*(1-tt)*tt*cpx + tt*tt*t.x;
    var ey = (1-tt)*(1-tt)*s.y + 2*(1-tt)*tt*cpy + tt*tt*t.y;
    // Tangent at endpoint for arrowhead
    var tax = 2*(1-tt)*(cpx-s.x) + 2*tt*(t.x-cpx);
    var tay = 2*(1-tt)*(cpy-s.y) + 2*tt*(t.y-cpy);

    if (isPattern) {
      if (isPattern) continue; // skip pattern edges entirely
    } else {
      // FLOWS_TO / TRANSFER edges: solid, gold gradient by amount, arrow
      // Main-path edges (from address_connection_risk's disjoint routes) are
      // colored bright green so they stand out from the 1-hop neighbor
      // expansion edges. Routes that pass through a commingling hub
      // (high counterparty count + high volume inner node — possible
      // unidentified mixer / unlabeled CEX) are painted amber yellow
      // instead to flag the route as a likely false positive.
      var edgeCol;
      if (l.is_main_path) {
        edgeCol = l.is_mixer_path ? '#fbbf24' : '#22c55e';
      } else {
        var ct = 0.3;
        if (amtRange > 0 && l.usd_amount > 0) {
          ct = 0.15 + ((l.usd_amount - amtExt[0]) / amtRange) * 0.85;
        }
        edgeCol = valueColor(ct);
      }
      ctx.strokeStyle = edgeCol;
      ctx.fillStyle   = edgeCol;

      if (l.is_main_path) {
        ctx.lineWidth = 3;
      } else if (amtRange > 0 && l.usd_amount > 0) {
        ctx.lineWidth = 1 + ((l.usd_amount-amtExt[0])/amtRange)*3;
      } else {
        ctx.lineWidth = 1;
      }

      ctx.beginPath();
      ctx.moveTo(s.x, s.y);
      if (totalInPair > 1) {
        ctx.quadraticCurveTo(cpx, cpy, ex, ey);
      } else {
        ctx.lineTo(ex, ey);
      }
      ctx.stroke();

      // Arrowhead along curve tangent
      var ang = Math.atan2(tay, tax);
      if (totalInPair <= 1) ang = Math.atan2(dy, dx);
      var aw = 8, aa = Math.PI/7;
      ctx.beginPath();
      ctx.moveTo(ex, ey);
      ctx.lineTo(ex - aw*Math.cos(ang-aa), ey - aw*Math.sin(ang-aa));
      ctx.lineTo(ex - aw*Math.cos(ang+aa), ey - aw*Math.sin(ang+aa));
      ctx.closePath();
      ctx.fill();

      // Edge label at curve midpoint (+ asset & date in timeline mode)
      if (l.usd_amount) {
        // Midpoint on the bezier curve (t=0.5)
        var mx = 0.25*s.x + 0.5*cpx + 0.25*t.x;
        var my = 0.25*s.y + 0.5*cpy + 0.25*t.y;
        ctx.save();
        ctx.font = '9px Inter, -apple-system, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'bottom';
        ctx.fillStyle = 'rgba(255,255,255,0.8)';
        var labelText = l.asset ? l.asset + ' ' + fmtUSD(l.usd_amount) : fmtUSD(l.usd_amount);
        ctx.fillText(labelText, mx, my - 4);
        if (l.timestamp) {
          ctx.font = '8px Inter, -apple-system, sans-serif';
          ctx.fillStyle = 'rgba(255,255,255,0.5)';
          ctx.fillText(fmtDate(l.timestamp), mx, my + 8);
        }
        ctx.restore();
      }
    }
  }
  }
  ctx.restore();
}

function drawNodes() {
  ctx.save();
  ctx.setLineDash([]);

  for (var i=0; i<nodes.length; i++) {
    var n = nodes[i];
    var r = n.r || DEF_R;
    var role = n.role;
    var st = Math.min(1, Math.max(0, (r-MIN_R)/(MAX_R-MIN_R)));

    // Fill: role color, intensity driven by risk_score
    // High risk = full color, low risk = blended toward dark bg
    var roleFill = role ? ROLE_FILLS[role] : null;
    var baseColor = roleFill || DEFAULT_NODE;
    var riskScore = n.risk_score || 0;
    // Mix base color with dark bg color based on risk (higher risk = more color)
    // Floor 0.55 so even low-risk nodes are clearly visible
    var mix = 0.55 + riskScore * 0.45;
    var color = mixColor(baseColor, COL_BG, mix);

    ctx.beginPath();
    ctx.arc(n.x, n.y, r, 0, Math.PI*2);
    ctx.fillStyle = color;
    ctx.fill();

    // Border: neon risk border for medium/high, subtle for rest
    if (n.risk_level === 'high') {
      ctx.strokeStyle = '#ff0044';
      ctx.lineWidth = 1;
    } else if (n.risk_level === 'medium') {
      ctx.strokeStyle = '#ff8800';
      ctx.lineWidth = 1;
    } else {
      ctx.strokeStyle = 'rgba(255,255,255,0.12)';
      ctx.lineWidth = 0.5;
    }
    ctx.stroke();

    // Labels below node
    ctx.font = '11px Inter, -apple-system, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    var ly = n.y + r + 6;
    ctx.fillStyle = '#fff';
    ctx.fillText(trunc(n.address), n.x, ly);
    ly += 14;
    if (n.tx_id) {
      // Timeline mode: show tx_id
      ctx.fillStyle = 'rgba(255,255,255,0.4)';
      ctx.font = '9px Inter, -apple-system, sans-serif';
      ctx.fillText(n.tx_id, n.x, ly);
      ly += 12;
    } else {
      if (n.role && n.role !== 'intermediary' && n.role !== 'counterparty') {
        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        var roleLabel = n.role;
        if (n.role === 'deposit' && depositExchange[n.address]) {
          roleLabel = depositExchange[n.address] + ' deposit';
        }
        ctx.fillText(roleLabel, n.x, ly);
        ly += 14;
      }
    }
    if (n.labels && n.labels.length) {
      ctx.fillStyle = 'rgba(242,221,166,0.7)';
      var lbl = n.labels.join(', ').split(',').map(function(s){return s.trim();}).filter(Boolean).slice(0,2).join(', ');
      ctx.fillText(lbl, n.x, ly);
    }
  }
  ctx.restore();
}

/* ───────────────────────────────────────────────────────────
   Hit testing
   ─────────────────────────────────────────────────────────── */
function hitNode(wx, wy) {
  for (var i=nodes.length-1; i>=0; i--) {
    var n=nodes[i], r=n.r||DEF_R, dx=wx-n.x, dy=wy-n.y;
    if (dx*dx+dy*dy <= r*r) return n;
  }
  return null;
}

function toWorld(cx, cy) { return {x:(cx-tf.x)/tf.k, y:(cy-tf.y)/tf.k}; }

/* ───────────────────────────────────────────────────────────
   Zoom + pan + drag
   ─────────────────────────────────────────────────────────── */
function initZoom() {
  zoomB = d3.zoom()
    .scaleExtent([0.2, 6])
    .filter(function(e) {
      if (e.type==='wheel') return true;
      if (e.ctrlKey||e.button) return false;
      if (e.type==='pointerdown') {
        var r=canvas.getBoundingClientRect(), w=toWorld(e.clientX-r.left,e.clientY-r.top);
        if (hitNode(w.x,w.y)) return false;
      }
      if (dragN) return false;
      return true;
    })
    .on('zoom', function(e) {
      if (!dragN) { tf=e.transform; draw(); }
    });
  d3.select(canvas).call(zoomB).on('dblclick.zoom',null);
}

function initInteraction() {
  canvas.addEventListener('pointerdown', function(e) {
    if (e.button!==0) return;
    var r=canvas.getBoundingClientRect(), w=toWorld(e.clientX-r.left,e.clientY-r.top);
    var hit=hitNode(w.x,w.y);
    if (hit) {
      dragN=hit;
      canvas.classList.add('dragging');
      if (layout==='force') worker.postMessage({type:'drag',address:hit.address,x:w.x,y:w.y,active:true});
      canvas.setPointerCapture(e.pointerId);
      e.preventDefault();
    }
  });

  canvas.addEventListener('pointermove', function(e) {
    if (!dragN) return;
    var r=canvas.getBoundingClientRect(), w=toWorld(e.clientX-r.left,e.clientY-r.top);
    dragN.x=w.x; dragN.y=w.y;
    if (layout==='force') worker.postMessage({type:'drag',address:dragN.address,x:w.x,y:w.y,active:true});
    draw();
  });

  canvas.addEventListener('pointerup', function(e) {
    if (dragN) {
      var r=canvas.getBoundingClientRect(), w=toWorld(e.clientX-r.left,e.clientY-r.top);
      if (layout==='force') worker.postMessage({type:'drag',address:dragN.address,x:w.x,y:w.y,active:false});
      dragN=null;
      canvas.classList.remove('dragging');
      savePositions();
    }
  });

}

/* ───────────────────────────────────────────────────────────
   Layout toggle
   ─────────────────────────────────────────────────────────── */
function setLayout(m) {
  layout = m;
  document.querySelectorAll('.layout-btn').forEach(function(b){ b.classList.toggle('active', b.dataset.layout===m); });
  if (!graphData) return;
  needFit = true;
  tf = d3.zoomIdentity;
  d3.select(canvas).call(zoomB.transform, tf);
  saveViewState();
  applyDataMode();
}

/* ───────────────────────────────────────────────────────────
   Fit to viewport
   ─────────────────────────────────────────────────────────── */
function fitView() {
  if (!nodes.length) return;
  var pad=80, mnx=Infinity,mxx=-Infinity,mny=Infinity,mxy=-Infinity;
  for(var i=0;i<nodes.length;i++){
    var n=nodes[i]; if(n.x<mnx)mnx=n.x; if(n.x>mxx)mxx=n.x; if(n.y<mny)mny=n.y; if(n.y>mxy)mxy=n.y;
  }
  mnx-=pad;mxx+=pad;mny-=pad;mxy+=pad;
  var bw=mxx-mnx, bh=mxy-mny;
  var sc=Math.min(W/bw, H/bh, 2);
  tf = d3.zoomIdentity.translate(W/2-(mnx+bw/2)*sc, H/2-(mny+bh/2)*sc).scale(sc);
  d3.select(canvas).call(zoomB.transform, tf);
  draw();
}

/* ───────────────────────────────────────────────────────────
   Public API
   ─────────────────────────────────────────────────────────── */
async function loadVisualizationData(toolResult) {
    // Prefer inline app_data (injected by mcp-proxy) over fetching data_url
    // to avoid sandbox CSP issues in Claude Desktop
    if (toolResult && toolResult.app_data) return toolResult.app_data;
    var dataUrl = toolResult && toolResult.data_url;
    if (!dataUrl) return toolResult;

    var MAX_RETRIES = 10;
    var BASE_DELAY_MS = 2000;
    var MAX_DELAY_MS = 15000;
    var loadingEl = document.getElementById('loading');

    for (var attempt = 1; attempt <= MAX_RETRIES; attempt++) {
        try {
            if (loadingEl) {
                loadingEl.textContent = attempt > 1
                    ? 'Processing on server... (attempt ' + attempt + '/' + MAX_RETRIES + ')'
                    : 'Loading visualization data...';
                loadingEl.classList.remove('hidden', 'error');
            }

            var resp = await fetch(dataUrl);

            if (resp.status === 200) {
                var data = await resp.json();
                if (data && (data.nodes || data.addresses || data.type)) {
                    return data;
                }
                // Valid 200 but unexpected shape — treat as not ready
            }

            if (resp.status === 410) {
                // Data expired
                if (loadingEl) {
                    loadingEl.textContent = 'Trace data expired. Please re-run the tool.';
                    loadingEl.classList.add('error');
                    loadingEl.classList.remove('hidden');
                }
                return null;
            }

            // 404, 503, or other — retry
        } catch (e) {
            // Network error — retry
        }

        if (attempt < MAX_RETRIES) {
            var delay = Math.min(
                BASE_DELAY_MS * Math.pow(1.5, attempt - 1) + Math.random() * 1000,
                MAX_DELAY_MS
            );
            await new Promise(function(r) { setTimeout(r, delay); });
        }
    }

    // Max retries exhausted
    if (loadingEl) {
        loadingEl.textContent = 'Data still processing. Please wait and refresh, or ask Claude to retry.';
        loadingEl.classList.add('error');
        loadingEl.classList.remove('hidden');
    }
    // Fall back to inline data if available
    return (toolResult && toolResult.app_data) || toolResult || null;
}

function showBrowserLink(dataUrl) {
  if (!dataUrl) return;
  try {
    var u = new URL(dataUrl);
    var href = u.origin + '/apps/graph.html?data_url=' + encodeURIComponent(dataUrl);
    document.getElementById('browser-link').href = href;
    document.getElementById('open-in-browser').style.display = '';
  } catch(e) {}
}

window.loadData = function(data) {
  document.getElementById('loading').classList.add('hidden');
  if (data && data.data_url) showBrowserLink(data.data_url);
  loadVisualizationData(data).then(function(graphData) { loadGraph(graphData); });
};

/* ───────────────────────────────────────────────────────────
   MCP Apps protocol — matches mcp-proxy topup widget
   ─────────────────────────────────────────────────────────── */
// MCP Apps protocol handshake (matches topup-server.ts golden reference)
(function() {
  var initId = 1;

  window.addEventListener('message', function(event) {
    var data = event.data;
    if (!data) return;

    // Non-JSONRPC fallback (fastmcp dev apps preview)
    if (data.type === 'tool-result' && data.result) { window.loadData(data.result); return; }

    if (data.jsonrpc !== '2.0') return;

    // Initialize response — host confirmed init
    if (data.id === initId && data.result) {
      // Send initialized notification
      window.parent.postMessage({jsonrpc:'2.0', method:'ui/notifications/initialized', params:{}}, '*');

      // Request square size — Claude Desktop will render in the artifact side panel
      // automatically because the tool has resourceUri set
      window.parent.postMessage({jsonrpc:'2.0', method:'ui/notifications/size-changed',
        params:{width:800, height:800}}, '*');
    }

    // Tool result — receive graph data from MCP tool call
    if (data.method === 'ui/notifications/tool-result' && data.params) {
      var c = data.params.content || [];
      for (var i=0; i<c.length; i++) {
        if (c[i].type==='text' && c[i].text) {
          try { var p=JSON.parse(c[i].text); if(p.nodes||p.data_url){window.loadData(p);return;} } catch(e){}
        }
      }
    }

    // Respond to pings
    if (data.method === 'ping' && data.id != null) {
      window.parent.postMessage({jsonrpc:'2.0', id:data.id, result:{}}, '*');
    }
  });

  // Send initialize request (only when embedded in host)
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({jsonrpc:'2.0', id:initId, method:'ui/initialize',
      params:{appInfo:{name:'Chain Insights Graph',version:'2.0.0'}, appCapabilities:{}, protocolVersion:'2026-01-26'}}, '*');
  }
})();

/* ───────────────────────────────────────────────────────────
   Boot
   ─────────────────────────────────────────────────────────── */
function boot() {
  initCanvas();
  bootWorker();
  initZoom();
  initInteraction();

  document.querySelectorAll('.layout-btn').forEach(function(b){
    b.addEventListener('click', function(){ setLayout(b.dataset.layout); });
  });
  document.getElementById('reset-btn').addEventListener('click', function(){
    clearPositions();
    applyDataMode();
  });
  document.querySelectorAll('.pal-btn').forEach(function(b){
    b.addEventListener('click', function(){ switchPalette(b.dataset.palette); });
  });
  document.querySelectorAll('.toggle-btn').forEach(function(b){
    b.addEventListener('click', function(){
      var t = b.dataset.toggle;
      if (t === 'flows') showFlows = !showFlows;
      if (t === 'patterns') showPatterns = !showPatterns;
      b.classList.toggle('active');
      draw();
    });
  });

  window.addEventListener('resize', function(){
    W=window.innerWidth; H=window.innerHeight;
    canvas.width=W*dpr; canvas.height=H*dpr;
    canvas.style.width=W+'px'; canvas.style.height=H+'px';
    draw();
  });

  // Check for inline embedded data (chain-insights CLI mode)
  if (typeof INLINE_DATA !== 'undefined' && INLINE_DATA) {
    document.getElementById('loading').classList.add('hidden');
    loadGraph(INLINE_DATA);
    return;
  }

  // Check for ?data_url= query param (standalone testing / direct link)
  var params = new URLSearchParams(window.location.search);
  var dataUrlParam = params.get('data_url');
  if (dataUrlParam) {
    (async function() {
      var MAX_RETRIES = 10;
      var BASE_DELAY_MS = 2000;
      var MAX_DELAY_MS = 15000;
      var loadingEl = document.getElementById('loading');

      for (var attempt = 1; attempt <= MAX_RETRIES; attempt++) {
        try {
          if (loadingEl) {
            loadingEl.textContent = attempt > 1
                ? 'Processing on server... (attempt ' + attempt + '/' + MAX_RETRIES + ')'
                : 'Loading visualization data...';
            loadingEl.classList.remove('hidden', 'error');
          }

          var resp = await fetch(dataUrlParam);

          if (resp.status === 200) {
            var data = await resp.json();
            if (data && (data.nodes || data.addresses || data.type)) {
              graphData = data;
              break;
            }
          }

          if (resp.status === 410) {
            if (loadingEl) {
              loadingEl.textContent = 'Trace data expired. Please re-run the tool.';
              loadingEl.classList.add('error');
            }
            return;
          }
        } catch (e) {
          // retry
        }

        if (attempt === MAX_RETRIES) {
          if (loadingEl) {
            loadingEl.textContent = 'Data still processing. Please wait and refresh, or ask Claude to retry.';
            loadingEl.classList.add('error');
          }
          return;
        }

        var delay = Math.min(
          BASE_DELAY_MS * Math.pow(1.5, attempt - 1) + Math.random() * 1000,
          MAX_DELAY_MS
        );
        await new Promise(function(r) { setTimeout(r, delay); });
      }

      if (graphData) {
        document.getElementById('loading').classList.add('hidden');
        showBrowserLink(dataUrlParam);
        loadGraph(graphData);
      }
    })();
  }
}

if (document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
else boot();

})();
</script>
</body>
</html>

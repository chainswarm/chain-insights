services:
  starrocks:
    image: starrocks/allin1-ubuntu:3.3.5
    expose:
      - "9030"

  memgraph:
    image: memgraph/memgraph:3.10.1
    expose:
      - "7687"
    volumes:
      - ./data:/data:ro

  memgql:
    image: memgraph/memgql:0.6.1
    environment:
      CONNECTOR_TYPE: multi
    ports:
      - "${DEVKIT_MCP_PORT:-18012}:8012"
    expose:
      - "7688"
    volumes:
      - ../../../ml/data-pipeline/ops/memgql:/mapping:ro

  starrocks-import:
    build:
      context: .
      dockerfile: Dockerfile.tools
    command: ["bash", "/devkit/scripts/import-starrocks.sh"]
    volumes:
      - ./scripts:/devkit/scripts:ro
      - ./data:/devkit/data:ro
      - ../../../ml/data-pipeline/ops/memgql:/mapping:ro
    depends_on:
      - starrocks

  memgraph-import:
    build:
      context: .
      dockerfile: Dockerfile.tools
    command: ["bash", "/devkit/scripts/import-memgraph.sh"]
    volumes:
      - ./scripts:/devkit/scripts:ro
      - ./data:/devkit/data:ro
      - ../../../ml/data-pipeline/ops/memgql:/mapping:ro
    depends_on:
      - memgraph

  memgql-bootstrap:
    build:
      context: .
      dockerfile: Dockerfile.tools
    network_mode: "service:memgql"
    command: ["bash", "/devkit/scripts/import-memgql.sh"]
    environment:
      MEMGQL_HOST: 127.0.0.1
      MEMGQL_PORT: "7688"
      MEMGQL_STARROCKS_MAPPING_FILE: /mapping/chain_insights_starrocks_mapping.json
    volumes:
      - ./scripts:/devkit/scripts:ro
      - ./data:/devkit/data:ro
      - ../../../ml/data-pipeline/ops/memgql:/mapping:ro
    depends_on:
      memgql:
        condition: service_started
      memgraph-import:
        condition: service_completed_successfully
      starrocks-import:
        condition: service_completed_successfully

  # Real Chain Insights Graph backend binary, built from the sibling
  # data-pipeline checkout (same convention as the memgql mapping mount).
  # x402 billing, telemetry, and dynamic capabilities are disabled: the
  # devkit exercises the tool/tier contract, not billing or warehouse
  # coverage. Flip GRAPH_MCP_DYNAMIC_CAPABILITIES_ENABLED once the fixture
  # carries the coverage/checkpoint sources dynamic capabilities probe.
  chain-insights-graph-devkit:
    build:
      context: ../../../ml/data-pipeline
      dockerfile: ops/Dockerfile
    image: chain-insights-graph-devkit:local
    command: ["/usr/local/bin/graphrag-mcp"]
    network_mode: "service:memgql"
    environment:
      PORT: "8012"
      METRICS_PORT: "0"
      MEMGRAPH_ZERO_URI_BITTENSOR: bolt://127.0.0.1:7688
      STARROCKS_HOST: starrocks
      STARROCKS_PORT: "9030"
      STARROCKS_USER: root
      STARROCKS_PASSWORD: ""
      STARROCKS_DATABASE: bittensor_semantic
      STARROCKS_DATABASE_BITTENSOR_SEMANTIC: bittensor_semantic
      STARROCKS_DATABASE_BITTENSOR_EVM: bittensor_semantic
      GRAPH_MCP_DYNAMIC_CAPABILITIES_ENABLED: "false"
      GRAPH_MCP_PER_QUERY_TIMEOUT_SECONDS: "10"
      GRAPH_MCP_STARROCKS_PER_QUERY_TIMEOUT_SECONDS: "30"
      X402_ENABLED: "false"
      TELEMETRY_ENABLED: "false"
    depends_on:
      memgql-bootstrap:
        condition: service_completed_successfully

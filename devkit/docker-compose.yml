services:
  starrocks:
    image: starrocks/allin1-ubuntu:3.3.5
    expose:
      - "9030"

  memgraph:
    image: memgraph/memgraph:3.10.1
    command: ["--query-execution-timeout-sec=10"]
    expose:
      - "7687"
    volumes:
      - ./data:/data:ro

  starrocks-import:
    build:
      context: .
      dockerfile: Dockerfile.tools
    command: ["bash", "/devkit/scripts/import-starrocks.sh"]
    volumes:
      - ./scripts:/devkit/scripts:ro
      - ./data:/devkit/data:ro
      # Graph node/edge → StarRocks table+column mapping, sourced from the
      # devkit's own vendored translator asset (internal/cyphersql/mapping.json).
      # Keeps the devkit self-contained so the MemGQL retirement can delete the
      # old federation mapping in data-pipeline without breaking devkit boot.
      - ./chain-insights-graph-devkit/internal/cyphersql/mapping.json:/mapping/chain_insights_starrocks_mapping.json:ro
    depends_on:
      - starrocks

  memgraph-import:
    build:
      context: .
      dockerfile: Dockerfile.tools
    command: ["bash", "/devkit/scripts/import-memgraph.sh"]
    volumes:
      - ./scripts:/devkit/scripts:ro
      - ./data:/devkit/data:ro
      - ./chain-insights-graph-devkit/internal/cyphersql/mapping.json:/mapping/chain_insights_starrocks_mapping.json:ro
    depends_on:
      - memgraph

  # Devkit-only lite Chain Insights Graph backend, built entirely from this
  # repository. It deliberately does not import or build the production
  # backend source: third-party developers host only this graph MCP against
  # locally served StarRocks and Memgraph, with no billing, metering, or
  # usage-reporting surface. Post MemGQL retirement it routes exactly like
  # production: USE live_topology → Memgraph directly (native Cypher), USE
  # archive_topology / facts → StarRocks directly via the corpus-scoped
  # translator. Its tool/tier contract is kept in sync with the production
  # backend by contract + corpus-parity tests.
  chain-insights-graph-devkit:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    ports:
      - "${DEVKIT_MCP_PORT:-18012}:8012"
    environment:
      DEVKIT_MCP_LISTEN_ADDRESS: ":8012"
      MEMGRAPH_BOLT_URI: bolt://memgraph:7687
      STARROCKS_HOST: starrocks
      STARROCKS_PORT: "9030"
      STARROCKS_USER: root
      STARROCKS_DATABASE: bittensor
    depends_on:
      memgraph-import:
        condition: service_completed_successfully
      starrocks-import:
        condition: service_completed_successfully

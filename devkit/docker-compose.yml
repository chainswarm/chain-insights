services:
  starrocks:
    image: starrocks/allin1-ubuntu:3.3.5
    ports:
      - "${STARROCKS_FE_PORT:-9030}:9030"

  memgraph:
    image: memgraph/memgraph:3.6
    ports:
      - "${MEMGRAPH_BOLT_PORT:-7687}:7687"

  memgql:
    image: alpine:3.20
    command: ["sh", "-c", "sleep infinity"]
    ports:
      - "${MEMGQL_PORT:-7444}:7444"

  starrocks-import:
    image: alpine:3.20
    command: ["sh", "-c", "test -d /data/starrocks"]
    volumes:
      - ./data:/data:ro
    depends_on:
      - starrocks

  memgraph-import:
    image: alpine:3.20
    command: ["sh", "-c", "test -d /data/memgraph"]
    volumes:
      - ./data:/data:ro
    depends_on:
      - memgraph

  memgql-bootstrap:
    image: alpine:3.20
    command: ["sh", "-c", "test -f /mapping/chain_insights_starrocks_mapping.json"]
    volumes:
      - ../../../ml/data-pipeline/ops/memgql:/mapping:ro
    depends_on:
      - memgql
      - memgraph
      - starrocks

  graphrag-mcp-devkit:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    ports:
      - "${DEVKIT_MCP_PORT:-8012}:8012"
    depends_on:
      - memgql

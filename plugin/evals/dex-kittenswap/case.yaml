schema_version: "1.0"
name: dex-kittenswap
expected_outcome: The agent resolves Kittenswap with meta_dex_lookup first, the memo only when the tool is absent, with no address from the user, finds its pools by its factory, loads the gauge trail, and names the router as the router, reading the buyer from the router's transfer in the seller's transaction.
execution:
  prompt: |
    A user asks: "Who sold into the busiest pool of Kittenswap on robinhood, and who bought?
    Name every address you would follow, and what each one is."

    The Chain Insights tools are not reachable right now, so do not try
    to call them. Write the first tool calls and graph queries you would
    send, in full, and one line each on what their answers tell you.
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Skill]
runs: 3
graders:
  - type: regex
    name: pool-or-factory-named
    target: last_message
    pattern: '0x45362763166cfed6174d312fa1449ea1fc37988a|meta_dex_lookup'
    match: contains
  - type: regex
    name: names-router
    target: last_message
    pattern: 'router'
    flags: i
    match: contains
  - type: regex
    name: buyer-from-the-routers-transfer
    target: last_message
    pattern: 'tx_id|same transaction|TRANSFER'
    match: contains
  - type: regex
    name: contract-never-buyer
    target: last_message
    pattern: '\b(router|pool manager|the manager|vault)\b[^.\n]{0,20}\b(is|was) the buyer\b|\bthe buyer (is|was) the (router|pool manager|manager|vault)\b(?!''s| pays| passes| forwards)'
    flags: i
    match: not_contains
  - type: regex
    name: full-addresses
    target: last_message
    pattern: '0x[0-9a-fA-F]{2,10}(…|\.\.\.)'
    match: not_contains
  - type: regex
    name: no-address-asked
    target: last_message
    pattern: '(give|send|share|provide|paste|tell) me (the |a |an |its )?(full )?((pool|factory|router|contract|exchange) )?address|what is the (pool|factory|router|contract) address|do you have (the|an?) ((pool|factory|router) )?address'
    flags: i
    match: not_contains
  - type: regex
    name: door-first
    target: last_message
    pattern: 'meta_dex_lookup'
    match: contains
  - type: tool_used
    name: skill-fired
    tool: Skill

schema_version: "1.0"
name: dex-kittenswap
expected_outcome: The agent resolves Kittenswap from the memo with no address from the user, finds its pools by brand or by its memo factory, loads the gauge trail, and names the router as the router, reading the buyer from the router's transfer in the seller's transaction.
execution:
  prompt: |
    A user asks: "Who sold into the busiest pool of Kittenswap on robinhood, and who bought?
    Name every address you would follow, and what each one is."

    The Chain Insights graph_query tool is not reachable right now, so do
    not try to call it. Write the first graph queries you would send, in
    full, and one line each on what their rows tell you.
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Skill]
runs: 3
graders:
  - type: regex
    name: brand-pool-or-factory-named
    target: last_message
    pattern: '0x45362763166cfed6174d312fa1449ea1fc37988a|brand: "kittenswap"'
    match: contains
  - type: regex
    name: names-router
    target: last_message
    pattern: 'router'
    flags: i
    match: contains
  - type: llm
    name: router-not-buyer
    criteria: >
      The answer treats a swap whose recipient is the exchange's router as a
      step to follow, reads the buyer from the router's own transfer in the
      same transaction on facts, and never calls the router the buyer.
    weight: 1
  - type: regex
    name: contract-never-buyer
    target: last_message
    pattern: '(router|pool manager|manager|vault) (is|was) the buyer|buyer (is|was) the (router|pool manager|manager|vault)'
    flags: i
    match: not_contains
  - type: regex
    name: full-addresses
    target: last_message
    pattern: '0x[0-9a-fA-F]{2,10}(…|\.\.\.)'
    match: not_contains
  - type: regex
    name: no-address-asked
    target: last_message
    pattern: '(give|send|share|provide|paste|tell) me (the |a |an |its )?(full )?((pool|factory|router|contract|exchange) )?address|what is the (pool|factory|router|contract) address|do you have (the|an?) ((pool|factory|router) )?address'
    flags: i
    match: not_contains
  - type: tool_used
    name: skill-fired
    tool: Skill

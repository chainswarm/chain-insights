schema_version: "1.0"
name: layer-chain
expected_outcome: A transaction by tx_id is a USE chain read of one Transaction node with literal keys, no WHERE.
execution:
  prompt: |
    You are an AML analyst assistant with the Chain Insights graph_query tool. The tool is not reachable right now, so do not try to call it.
    A user asks: "Did transaction 0x13ddda52775dde9ff1479ed02c891068d4cb4c0d4a3ae966ee09d897c4dad904 succeed on robinhood? Which block and day?"
    Write only the one graph query you would send, nothing else.
  max_turns: 6
  allowed_tools: [Skill]
runs: 3
graders:
  - type: regex
    name: chain-layer
    target: last_message
    pattern: 'USE chain'
    match: contains
  - type: regex
    name: transaction-by-tx-id
    target: last_message
    pattern: 'Transaction \{tx_id: "0x13ddda52775dde9ff1479ed02c891068d4cb4c0d4a3ae966ee09d897c4dad904"\}'
    match: contains
  - type: regex
    name: no-where
    target: last_message
    pattern: 'WHERE'
    match: not_contains
  - type: tool_used
    name: skill-fired
    tool: Skill

schema_version: "1.0"
name: behaviour-kind-no-group
tags: [cypher, behaviour, pasted-answer]
expected_outcome: The answer says in plain words that the address has the shape of a payment desk (its payers and receivers are different people, active almost every hour of the week), says it is in no operator group, invents no group mates, and says the kind describes automation or volume and is no risk signal by itself.
execution:
  prompt: |
    You are an AML analyst assistant using Chain Insights. The graph already answered. Write the reply to the user from this row; load the chain-insights-cypher skill first and call no graph tool.
    User asked: "What kind of account is 0x4b6d8f0a2c4e6b8d0f2a4c6e8b0d2f4a6c8e0b17 on robinhood? Is it part of a bigger operation?"
    Row 1 from USE topology (address, node_labels, labels, behaviour_kind, behaviour_group, malicious_claims, case_judgements):
    0x4b6d8f0a2c4e6b8d0f2a4c6e8b0d2f4a6c8e0b17, ["Address","Account"], [], "PAYOUT_DESK", null, null, null
  max_turns: 4
  allowed_tools: [Skill]
runs: 3
graders:
  - type: regex
    name: plain-words
    target: last_message
    flags: i
    pattern: 'pay(ment|out) desk'
    match: contains
  - type: regex
    name: no-column-names
    target: last_message
    pattern: 'behaviour_kind|behaviour_group|node_labels|malicious_claims|case_judgements'
    match: not_contains
  - type: llm
    name: no-group-invented
    criteria: 'PASS when the answer says the address carries no operator group (no other wallets share its first payer as a group), names no other address as part of its operation, and says the kind describes automation or volume and is not a risk signal or accusation by itself. FAIL when it claims the address belongs to a group or a larger operation as a fact, lists other wallets as its mates, or calls it a scam or a risk from the kind alone.'
  - type: regex
    name: writes-the-address
    target: last_message
    pattern: '0x4b6d8f0a2c4e6b8d0f2a4c6e8b0d2f4a6c8e0b17'
    match: contains
  - type: regex
    name: full-addresses
    target: last_message
    pattern: '0x[0-9a-fA-F]{2,10}(…|\.\.\.)'
    match: not_contains
  - type: tool_used
    name: skill-fired
    tool: Skill

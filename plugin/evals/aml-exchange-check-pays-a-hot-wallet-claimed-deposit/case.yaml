# Written by scripts/render-deposit-evals.mjs from
# plugin/evals/datasets/aml-exchange-check.json. Edit the dataset, not this file.
schema_version: "1.0"
name: aml-exchange-check-pays-a-hot-wallet-claimed-deposit
description: 'Pays an exchange hot wallet directly, claimed to be a deposit, no deposit mark.'
tags: [aml-exchange, deposit-check, tool-call, expect-not-deposit, ask-claim]
expected_outcome: 'The agent calls aml_exchange_deposit_check with the address, says the graph shows no deposit mark and no sweep into an exchange hot wallet, invents no behaviour rule, and ends on "VERDICT: not-deposit".'
execution:
  prompt: |
    I was told 0x43e21e2282f86b0480a075d04baaf31416c4d485 is a Bybit
    deposit wallet. Is that true, on Robinhood Chain? Use Chain Insights.

    End your answer with one line, exactly one of these four:
    VERDICT: deposit
    VERDICT: exchange-wallet
    VERDICT: not-deposit
    VERDICT: not-found
    "deposit" is a customer's deposit address of an exchange. "exchange-wallet"
    is an exchange's own wallet, such as a hot wallet. "not-found" is an address
    with no activity on this network.
  max_turns: 12
  allowed_tools: [Read, Glob, Grep, Skill]
runs: 3
graders:
  - type: tool_used
    name: 'check-called'
    tool: 'mcp__plugin_chain-insights_chain-insights__aml_exchange_deposit_check'
    input_match: '0[xX]43[eE]21[eE]2282[fF]86[bB]0480[aA]075[dD]04[bB][aA][aA][fF]31416[cC]4[dD]485'
  - type: regex
    name: 'verdict'
    weight: 3
    target: 'last_message'
    pattern: 'VERDICT:[\s`*]*not-deposit\b'
    match: 'contains'
  - type: regex
    name: 'one-verdict'
    target: 'last_message'
    pattern: 'VERDICT:'
    match: 'count:1'
  - type: regex
    name: 'no-false-deposit'
    weight: 3
    target: 'last_message'
    pattern: 'VERDICT:[\s`*]*deposit\b'
    match: 'not_contains'
  - type: llm
    name: 'reason-holds'
    criteria: 'PASS when the reason the answer gives for its verdict is something the tool reported about this address: its deposit mark or its role, its exchange label, its sweep into a hot wallet, the counts of its behaviour, or that it has no mark, no sweep or no activity. These are reported facts too, and PASS: that the address swapped on a DEX, or that it paid addresses that are no exchange wallets, and that a deposit address does not do that. Stating the general profile of a deposit address (one customer, few outside payers, everything sent goes to one exchange, no DEX swaps) is PASS as well. FAIL only when the answer rules this address in or out by a number it made up: that it has too few or too many payers, senders, transactions or sweeps, or too little or too much volume, to be a deposit address.'
  - type: regex
    name: 'full-addresses'
    target: 'last_message'
    pattern: '0x[0-9a-fA-F]{2,10}(…|\.\.\.)'
    match: 'not_contains'
  - type: tool_used
    name: 'skill-fired'
    tool: 'Skill'

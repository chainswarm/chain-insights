schema_version: "1.0"
name: virtuals-creator-ranking
expected_outcome: The agent writes a USE topology query anchored on the Virtuals starting-pool factory 0xfc2e4da3edb2e18100473339c763705d263d20a9 that groups DEPLOYED_CONTRACT links by tx_origin, and says the deployer field is the factory, not the creator.
execution:
  prompt: |
    On Chain Insights (network robinhood), I want to know which wallets
    created the most Virtuals Protocol agents, ranked by how many agents
    each one created.

    Call no graph tool. Write the exact graph_query you would send, then
    say in two lines which field identifies the creator and why.
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Skill]
runs: 3
graders:
  - type: regex
    name: starting-pool-factory
    target: last_message
    pattern: '0xfc2e4da3edb2e18100473339c763705d263d20a9'
    match: contains
  - type: regex
    name: groups-by-tx-origin
    target: last_message
    pattern: 'tx_origin'
    match: contains
  - type: regex
    name: no-deployer-as-creator
    target: last_message
    pattern: 'deployer_address AS creator'
    match: not_contains
  - type: tool_used
    name: skill-fired
    tool: Skill

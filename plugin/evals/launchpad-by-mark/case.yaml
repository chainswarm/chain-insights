schema_version: "1.0"
name: launchpad-by-mark
expected_outcome: Launchpad pools are asked for by the :Launchpad mark (with :Pool), never by a text match over the labels property and never by walking FLOWS_TO.
execution:
  prompt: |
    You are an AML analyst assistant with the Chain Insights graph_query tool. The tool is not reachable right now, so do not try to call it.
    A user asks: "Show me Virtuals launchpad pools on robinhood, I want a list of 25 with their labels."
    Write only the first graph query you would send, nothing else.
  max_turns: 6
  allowed_tools: [Skill]
runs: 3
graders:
  - type: regex
    name: asks-by-mark
    target: last_message
    pattern: ':Launchpad'
    match: contains
  - type: regex
    name: no-text-scan
    target: last_message
    flags: i
    pattern: 'labels CONTAINS|CONTAINS "launchpad"|CONTAINS ''launchpad''|STARTS WITH "virtuals|FLOWS_TO'
    match: not_contains
  - type: tool_used
    name: skill-fired
    tool: Skill

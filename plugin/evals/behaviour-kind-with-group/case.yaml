schema_version: "1.0"
name: behaviour-kind-with-group
tags: [cypher, behaviour, pasted-answer]
expected_outcome: The answer says in plain words that the address is one wallet of a swap-bot farm (funds in from hundreds of brand-new wallets, swaps through a router, pays hundreds of other brand-new wallets), that it shares a first payer with the other wallets of its group, which looks like one operator's wallets, names the payer and the group mates in full, and says the kind describes automation or volume and is no risk signal or accusation by itself.
execution:
  prompt: |
    You are an AML analyst assistant using Chain Insights. The graph already answered. Write the reply to the user from these rows; load the chain-insights-cypher skill first and call no graph tool.
    User asked: "What is 0x3c1e5a7b9d0f2e4c6a8b0d1f3e5c7a9b1d3f5e70 on robinhood, and who else belongs with it?"
    Row 1 from USE topology (address, node_labels, labels, behaviour_kind, behaviour_group, risk_claims):
    0x3c1e5a7b9d0f2e4c6a8b0d1f3e5c7a9b1d3f5e70, ["Address","Account"], [], "SWAP_BOT_FARM_WALLET", "SWAP_BOT_FARM_WALLET:0x8f2d4b6a1c3e5f7a9b0c2d4e6f8a0b1c3d5e7f92", null
    Row 2 from USE topology, the first payer (address, node_labels, labels, is_exchange, receivers):
    0x8f2d4b6a1c3e5f7a9b0c2d4e6f8a0b1c3d5e7f92, ["Address","Account"], [], null, 41
    Rows 3 to 5 from USE topology, the payer's receivers in the group (from_address, to_address, amount_usd_sum, tx_count, first_seen_timestamp_utc):
    0x8f2d4b6a1c3e5f7a9b0c2d4e6f8a0b1c3d5e7f92, 0x3c1e5a7b9d0f2e4c6a8b0d1f3e5c7a9b1d3f5e70, 1250.0, 3, 2026-11-02 09:14 UTC
    0x8f2d4b6a1c3e5f7a9b0c2d4e6f8a0b1c3d5e7f92, 0x5d7f9b1a3c5e7d9f1b3a5c7e9d1f3b5a7c9e1d34, 1180.0, 2, 2026-11-02 09:15 UTC
    0x8f2d4b6a1c3e5f7a9b0c2d4e6f8a0b1c3d5e7f92, 0x7e9a1c3b5d7f9e1a3c5b7d9f1e3a5c7b9d1f3a56, 1302.5, 2, 2026-11-02 09:17 UTC
  max_turns: 4
  allowed_tools: [Skill]
runs: 3
graders:
  - type: regex
    name: plain-words
    target: last_message
    flags: i
    pattern: 'swap[- ]bot farm'
    match: contains
  - type: regex
    name: names-the-group-mates
    target: last_message
    pattern: '0x5d7f9b1a3c5e7d9f1b3a5c7e9d1f3b5a7c9e1d34[\s\S]*0x7e9a1c3b5d7f9e1a3c5b7d9f1e3a5c7b9d1f3a56|0x7e9a1c3b5d7f9e1a3c5b7d9f1e3a5c7b9d1f3a56[\s\S]*0x5d7f9b1a3c5e7d9f1b3a5c7e9d1f3b5a7c9e1d34'
    match: contains
  - type: regex
    name: names-the-payer
    target: last_message
    pattern: '0x8f2d4b6a1c3e5f7a9b0c2d4e6f8a0b1c3d5e7f92'
    match: contains
  - type: regex
    name: no-column-names
    target: last_message
    pattern: 'behaviour_kind|behaviour_group|node_labels|risk_claims'
    match: not_contains
  - type: llm
    name: same-operator-not-accused
    criteria: 'PASS when the answer says the address and the two other wallets share the same first payer, 0x8f2d4b6a1c3e5f7a9b0c2d4e6f8a0b1c3d5e7f92, so they look like one operator''s wallets, and says that this kind describes automation or volume and is not a risk signal or an accusation by itself. FAIL when it calls the address or its operator a scammer, a fraudster, a launderer or criminal, or when it states a risk verdict from the kind alone.'
  - type: regex
    name: full-addresses
    target: last_message
    pattern: '0x[0-9a-fA-F]{2,10}(…|\.\.\.)'
    match: not_contains
  - type: tool_used
    name: skill-fired
    tool: Skill

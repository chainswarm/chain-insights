schema_version: "1.0"
name: dex-uniswap-v3
expected_outcome: The agent resolves Uniswap v3 with meta_dex_lookup first, the memo only when the tool is absent, with no address from the user, finds its pools anchored on each factory in one batch, and reads the sellers into the busiest pool.
execution:
  prompt: |
    A user asks: "Which pools does Uniswap v3 have on robinhood, and who trades on the busiest one?"

    The Chain Insights tools are not reachable right now, so do not try
    to call them. Write the first tool calls and graph queries you would
    send, in full, and one line each on what their answers tell you.
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Skill]
runs: 3
graders:
  - type: regex
    name: pool-or-factory-named
    target: last_message
    pattern: '0x0bfbcf9fa4f9c56b0f40a671ad40e0805a091865|0x1f7d7550b1b028f7571e69a784071f0205fd2efa|0x10cc6bd38112cac182db90b6a71d8bb5939526ba|meta_dex_lookup'
    match: contains
  - type: regex
    name: pools-by-door-or-factory
    target: last_message
    pattern: 'DEPLOYED_CONTRACT|meta_dex_lookup'
    match: contains
  - type: regex
    name: full-addresses
    target: last_message
    pattern: '0x[0-9a-fA-F]{2,10}(…|\.\.\.)'
    match: not_contains
  - type: regex
    name: no-address-asked
    target: last_message
    pattern: '(give|send|share|provide|paste|tell) me (the |a |an |its )?(full )?((pool|factory|router|contract|exchange) )?address|what is the (pool|factory|router|contract) address|do you have (the|an?) ((pool|factory|router) )?address'
    flags: i
    match: not_contains
  - type: regex
    name: door-first
    target: last_message
    pattern: 'meta_dex_lookup'
    match: contains
  - type: tool_used
    name: skill-fired
    tool: Skill

schema_version: "1.0"
name: virtuals-bridge-origin
expected_outcome: The agent reads the BRIDGED link to a Chain node on the creator wallet's own address, not on the bridge contract, to find which chain funded it.
execution:
  prompt: |
    A Virtuals creator wallet on Robinhood Chain,
    0x384d92776496bce2c6f08d5b8e015eae498e78b3, got its first money from
    the bridge contract 0xd29c85f15df544ba632c9e25829fd29d767d7978. I read
    the bridge node in Chain Insights and it has no chain links.

    Where is the origin chain recorded, and what query reads it? Call no
    graph tool. Give the exact query.
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Skill]
runs: 3
graders:
  - type: regex
    name: bridged-to-chain
    target: last_message
    pattern: 'BRIDGED\]-?>?\s*\(\w*:?Chain\)|:Chain'
    match: contains
  - type: regex
    name: anchored-on-wallet
    target: last_message
    pattern: '\{address: "0x384d92776496bce2c6f08d5b8e015eae498e78b3"\}\)-\[\w*:BRIDGED'
    match: contains
  - type: tool_used
    name: skill-fired
    tool: Skill

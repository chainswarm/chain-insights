schema_version: "1.0"
name: basket-is-this-a-basket
expected_outcome: Whether an address is a stock basket is asked of that one address, by its own labels or by the basket factory having created it, never by a text scan over labels.
execution:
  prompt: |
    You are an AML analyst assistant with the Chain Insights graph_query tool. The tool is not reachable right now, so do not try to call it.
    A user asks: "Is 0x844e7f539ec3e90391b35843001e8624bef6eb83 on robinhood a stock basket token?"
    Write only the first graph query you would send, nothing else.
  max_turns: 6
  allowed_tools: [Skill]
runs: 3
graders:
  - type: regex
    name: anchored-on-the-address
    target: last_message
    pattern: '0x844e7f539ec3e90391b35843001e8624bef6eb83'
    match: contains
  - type: regex
    name: reads-labels-or-factory
    target: last_message
    pattern: 'a\.labels|DEPLOYED_CONTRACT'
    match: contains
  - type: regex
    name: no-text-scan
    target: last_message
    flags: i
    pattern: 'labels CONTAINS|CONTAINS "basket"|CONTAINS ''basket''|toLower\('
    match: not_contains
  - type: tool_used
    name: skill-fired
    tool: Skill

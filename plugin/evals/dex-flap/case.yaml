schema_version: "1.0"
name: dex-flap
expected_outcome: The agent takes Flap's factory from the memo with no address from the user, loads the launchpad trail, reads the launches with the creator from tx_origin, and reads graduation from the first pool.
execution:
  prompt: |
    A user asks: "Who launched tokens on Flap on robinhood, and did any of them graduate
    to an exchange pool?"

    The Chain Insights graph_query tool is not reachable right now, so do
    not try to call it. Write the first graph queries you would send, in
    full, and one line each on what their rows tell you.
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Skill]
runs: 3
graders:
  - type: regex
    name: brand-pool-or-factory-named
    target: last_message
    pattern: '0x0d1ebb179cdbca88d74c923c4255cb2b17474afd|brand[^\n]{0,8}flap'
    match: contains
  - type: regex
    name: creator-is-tx-origin
    target: last_message
    pattern: 'tx_origin'
    match: contains
  - type: regex
    name: full-addresses
    target: last_message
    pattern: '0x[0-9a-fA-F]{2,10}(…|\.\.\.)'
    match: not_contains
  - type: regex
    name: no-address-asked
    target: last_message
    pattern: '(give|send|share|provide|paste|tell) me (the |a |an |its )?(full )?((pool|factory|router|contract|exchange) )?address|what is the (pool|factory|router|contract) address|do you have (the|an?) ((pool|factory|router) )?address'
    flags: i
    match: not_contains
  - type: tool_used
    name: skill-fired
    tool: Skill

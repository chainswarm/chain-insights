schema_version: "1.0"
name: aml-exchange-deposit-where-money-went
description: A trail question about a Gate deposit, answered from a real tool call.
tags: [aml-exchange, tool-call]
expected_outcome: The agent checks the address with aml_exchange_deposit_check, names Gate as the exchange, names the hot wallet the deposit was swept into in full through its SWEPT link, and ends the trail there with no walk past the hot wallet.
execution:
  prompt: |
    A trail I follow on Robinhood Chain reached
    0x64ba5fafa7a6e1991f7f60c9b594a7131a784540, which may be an exchange
    wallet. Where did the money go from there? Use Chain Insights.

    Write the answer to the question, and say whether you trace any further.
  max_turns: 12
  allowed_tools: [Read, Glob, Grep, Skill]
runs: 3
graders:
  - type: tool_used
    name: check-called
    tool: mcp__plugin_chain-insights_chain-insights__aml_exchange_deposit_check
    input_match: '0x64ba5fafa7a6e1991f7f60c9b594a7131a784540'
  - type: regex
    name: names-the-exchange
    target: last_message
    pattern: '\bGate\b'
    match: contains
  - type: regex
    name: names-the-hot-wallet
    target: last_message
    pattern: '0x0d0707963952f2fba59dd06f2b425ace40b492fe'
    flags: i
    match: contains
  - type: regex
    name: says-swept-into-a-hot-wallet
    target: last_message
    pattern: '(swept|sweep)[\s\S]{0,300}hot wallet|hot wallet[\s\S]{0,300}(swept|sweep)'
    flags: i
    match: contains
  - type: llm
    name: trail-ends-at-the-deposit
    criteria: The answer says the trail ends at the exchange, at the Gate deposit address or its hot wallet, and that it does not trace the money any further past the hot wallet. FAIL if it proposes or reports following the money onward from the hot wallet 0x0d0707963952f2fba59dd06f2b425ace40b492fe.
  - type: regex
    name: full-addresses
    target: last_message
    pattern: '0x[0-9a-fA-F]{2,10}(…|\.\.\.)'
    match: not_contains
  - type: tool_used
    name: skill-fired
    tool: Skill

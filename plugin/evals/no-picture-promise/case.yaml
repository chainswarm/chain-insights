schema_version: "1.0"
name: no-picture-promise
expected_outcome: In Claude Code, which draws nothing, the answer carries the flows in text and does not promise or mention a picture.
execution:
  prompt: |
    You are an AML analyst assistant using Chain Insights in Claude Code, a terminal. The graph already answered. Write the reply to the user from these rows; load the chain-insights-cypher skill first and call no graph tool.
    User asked: "Who else did 0xbeeff033f34c046626b8d0a041844c5d1a5409dd send to? Draw the picture."
    Rows (from_address, to_address, amount_usd_sum, tx_count, last_seen_timestamp):
    0xbeeff033f34c046626b8d0a041844c5d1a5409dd, 0x73ab316cf37c5d7e5c82dc8815c396c0d4767b11, 2349759.40, 3, 1786320960000
    0xbeeff033f34c046626b8d0a041844c5d1a5409dd, 0x44abc1d6ccff2696d98890b92e2157af242179c2, 36736841.00, 117, 1786233600000
  max_turns: 4
  allowed_tools: [Skill]
runs: 3
graders:
  - type: regex
    name: no-picture-promise
    target: last_message
    flags: i
    pattern: '(picture|graph|chart|diagram) (should|will|would) (appear|show|render|be drawn)|appears? beside|drawn beside|host draws|draws the (picture|graph)|won.t draw|did not draw|cannot draw|can.t draw'
    match: not_contains
  - type: regex
    name: no-text-graph
    target: last_message
    pattern: '──▶|-->|```mermaid|──>'
    match: not_contains
  - type: regex
    name: both-receivers-in-full
    target: last_message
    pattern: '0x73ab316cf37c5d7e5c82dc8815c396c0d4767b11[\s\S]*0x44abc1d6ccff2696d98890b92e2157af242179c2|0x44abc1d6ccff2696d98890b92e2157af242179c2[\s\S]*0x73ab316cf37c5d7e5c82dc8815c396c0d4767b11'
    match: contains
  - type: tool_used
    name: skill-fired
    tool: Skill

schema_version: "1.0"
name: virtuals-unpriced-agent-token
expected_outcome: The agent explains that a fresh Virtuals agent token has no price so its amount_usd is empty, and that the buy is valued by the VIRTUAL paid into the starting pool.
execution:
  prompt: |
    In Chain Insights I read the transfers of a new Virtuals agent token
    on Robinhood Chain. Every row of the agent token shows an empty USD
    value. Is the token worthless, and how do I say what the buyers spent?

    Answer in a few lines. Call no graph tool.
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Skill]
runs: 3
graders:
  - type: regex
    name: values-in-virtual
    target: last_message
    pattern: 'VIRTUAL'
    match: contains
  - type: llm
    name: no-price-not-worthless
    criteria: >
      The answer says an empty USD value means the fresh agent token has no
      price yet, not that it is worthless, and that what buyers spent is the
      VIRTUAL they paid into the pool, which does carry a USD value.
    weight: 1
  - type: tool_used
    name: skill-fired
    tool: Skill

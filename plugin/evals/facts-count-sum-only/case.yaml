schema_version: "1.0"
name: facts-count-sum-only
expected_outcome: A smallest-transfer question on a pair and a day is a facts read of the rows (or count/sum), never a min() aggregate or a grouping key on facts.
execution:
  prompt: |
    You are an AML analyst assistant with the Chain Insights graph_query tool. The tool is not reachable right now, so do not try to call it.
    A user asks: "What was the smallest transfer from 0xc5e188541d107e8b79e43478bde365f1406665d6 to 0xbeeff033f34c046626b8d0a041844c5d1a5409dd on 2026-08-04 on robinhood?"
    Write only the one graph query you would send, nothing else.
  max_turns: 6
  allowed_tools: [Skill]
runs: 3
graders:
  - type: regex
    name: facts-layer
    target: last_message
    pattern: 'USE facts'
    match: contains
  - type: regex
    name: no-min-aggregate
    target: last_message
    flags: i
    pattern: '\b(min|max|avg)\s*\('
    match: not_contains
  - type: regex
    name: no-order-by
    target: last_message
    pattern: 'ORDER BY'
    match: not_contains
  - type: tool_used
    name: skill-fired
    tool: Skill

schema_version: "1.0"
name: aml-exchange-hot-wallet-is-exchange
description: Is this address an exchange, answered from a real tool call.
tags: [aml-exchange, tool-call]
expected_outcome: The agent asks meta_exchange_lookup or aml_exchange_deposit_check with the address, and answers yes, it is a hot wallet of Bitget on robinhood, with the address in full; a trail that reaches it ends there.
execution:
  prompt: |
    Is 0xed9ab5bc05a0152b9dc2f7902e8369af7bc18771 an exchange, on Robinhood
    Chain? Use Chain Insights.
  max_turns: 12
  allowed_tools: [Read, Glob, Grep, Skill]
runs: 3
graders:
  - type: regex
    name: check-called
    target: mock_calls
    pattern: '0xed9ab5bc05a0152b9dc2f7902e8369af7bc18771'
    flags: i
    match: contains
  - type: regex
    name: says-yes
    target: last_message
    pattern: '\byes\b'
    flags: i
    match: contains
  - type: regex
    name: names-the-exchange
    target: last_message
    pattern: '\bBitget\b'
    match: contains
  - type: regex
    name: says-hot-wallet
    target: last_message
    pattern: 'hot wallet'
    flags: i
    match: contains
  - type: regex
    name: full-address
    target: last_message
    pattern: '0xed9ab5bc05a0152b9dc2f7902e8369af7bc18771'
    flags: i
    match: contains
  - type: regex
    name: full-addresses
    target: last_message
    pattern: '0x[0-9a-fA-F]{2,10}(…|\.\.\.)'
    match: not_contains
  - type: tool_used
    name: skill-fired
    tool: Skill

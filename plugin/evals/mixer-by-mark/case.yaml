schema_version: "1.0"
name: mixer-by-mark
expected_outcome: A whole-chain question about mixers is asked by the :Mixer mark, a label match the server answers from its index, never by a text match over the labels property.
execution:
  prompt: |
    You are an AML analyst assistant with the Chain Insights graph_query tool. The tool is not reachable right now, so do not try to call it.
    A user asks: "Which mixer contracts exist on robinhood? List them all."
    Write only the first graph query you would send, nothing else.
  max_turns: 6
  allowed_tools: [Skill]
runs: 3
graders:
  - type: regex
    name: asks-by-mark
    target: last_message
    pattern: 'MATCH \([a-z]+:Mixer\)'
    match: contains
  - type: regex
    name: no-text-scan
    target: last_message
    flags: i
    pattern: 'labels CONTAINS|CONTAINS "mixer"|CONTAINS ''mixer''|toLower\('
    match: not_contains
  - type: tool_used
    name: skill-fired
    tool: Skill

schema_version: "1.0"
name: dex-uniswap-v2
expected_outcome: The agent finds no proven factory for Uniswap v2 in the memo, reads the brands the graph serves instead, and says plainly when Uniswap v2 is not covered, with no whole-chain search and no address asked.
execution:
  prompt: |
    A user asks: "Which pools does Uniswap v2 have on robinhood, and who trades on the busiest one?"

    The Chain Insights graph_query tool is not reachable right now, so do
    not try to call it. Write the first graph queries you would send, in
    full, and one line each on what their rows tell you.
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Skill]
runs: 3
graders:
  - type: regex
    name: brand-list
    target: last_message
    pattern: 'p\.brand'
    match: contains
  - type: llm
    name: not-covered-honestly
    criteria: >
      The answer says the memo holds no proven factory for Uniswap v2, reads
      the brand list the graph serves, and says Uniswap v2 is not covered when
      that list lacks it, listing covered exchanges, with no whole-chain
      search.
    weight: 1
  - type: regex
    name: full-addresses
    target: last_message
    pattern: '0x[0-9a-fA-F]{2,10}(…|\.\.\.)'
    match: not_contains
  - type: regex
    name: no-address-asked
    target: last_message
    pattern: '(give|send|share|provide|paste|tell) me (the |a |an |its )?(full )?((pool|factory|router|contract|exchange) )?address|what is the (pool|factory|router|contract) address|do you have (the|an?) ((pool|factory|router) )?address'
    flags: i
    match: not_contains
  - type: tool_used
    name: skill-fired
    tool: Skill

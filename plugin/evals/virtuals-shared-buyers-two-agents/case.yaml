schema_version: "1.0"
name: virtuals-shared-buyers-two-agents
expected_outcome: The agent finds wallets that received tokens from both Virtuals starting pools with a two-pool FLOWED_TO pattern meeting at one wallet, and excludes the router hub by address.
execution:
  prompt: |
    Two Virtuals agents on Robinhood Chain have starting pools
    0x09e9df72f639875b58dbfd356e31c47b0b87f65b and
    0x5ac700aa75cb4f3e7f2cf96756b9a30497f86b08. I think the same group
    of wallets bought both. Which Chain Insights query lists the wallets
    that bought into both agents?

    Call no graph tool. Write the exact query.
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Skill]
runs: 3
graders:
  - type: regex
    name: meets-at-one-wallet
    target: last_message
    pattern: '\)<-\[:FLOWED_TO\]-\('
    match: contains
  - type: regex
    name: excludes-router
    target: last_message
    pattern: 'NOT \w+\.address IN \["0x65050a9b7e5075a2ba5ced7b1b64ee66262c40dc"'
    match: contains
  - type: tool_used
    name: skill-fired
    tool: Skill

version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
    open-pull-requests-limit: 10
    groups:
      mcp-and-payments:
        patterns:
          - "@modelcontextprotocol/*"
          - "@x402/*"
          - "viem"
      tooling:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:45"
    open-pull-requests-limit: 5

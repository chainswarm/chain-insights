name: Docs

# Vendored from rbmk docs-reusable.yml (public repo cannot call private
# reusable workflows) — keep in sync manually; owner ruling 2026-07-21.
#
# chain-insights is a PUBLIC repo. GitHub hard-blocks a public caller's
# `uses:` of a PRIVATE reusable workflow (chainswarm/rbmk is private), so
# the previous thin-caller form (`uses: chainswarm/rbmk/.github/workflows/
# docs-reusable.yml@main`) failed in 0s on every push. That block applies
# ONLY to the reusable-workflow `uses:` mechanism — checking out the
# private rbmk repo with the org App token inside a normal job step is
# fine, which is what this vendored copy does. Logic below is inlined
# from chainswarm/rbmk/.github/workflows/docs-reusable.yml; if that file
# changes, re-sync this one by hand.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Generate repo docs
    runs-on: [self-hosted, chainswarm-runner]
    steps:
      - name: Checkout caller repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # GHCR_TOKEN, when present, is a classic PAT belonging to an
          # org-admin user (confirmed live: scopes include `repo`,
          # `permission: admin` on a real repo) -- persisting ITS
          # credentials here means the commit-back push at the bottom of
          # this job authenticates as that admin user, which IS covered
          # by every ruleset's OrganizationAdmin bypass_actor. Falls back
          # to the default GITHUB_TOKEN (works for repos with no
          # moa-pr-review ruleset yet; rejected by GH013 for repos that
          # have one, same as before this token was wired in -- see rbmk
          # git history for the chainswarm-ci App token attempt that
          # turned out to have no write access at all).
          token: ${{ secrets.GHCR_TOKEN || github.token }}

      - name: Mint chainswarm-ci app token (org-scoped)
        # Used only for the cross-repo private rbmk checkout below, which
        # only needs read access. This App's actual configured permission
        # is `"contents": "read"` -- it has NO write access to repo
        # contents on any repo, so it can never be the identity the
        # commit-back push authenticates as.
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.CHAINSWARM_GITHUB_APP_ID }}
          private-key: ${{ secrets.CHAINSWARM_GITHUB_APP_PRIVATE_KEY }}
          owner: chainswarm
          # owner set + repositories omitted => token covers every repo the App
          # is installed on (installed as "All repositories") — what cross-repo
          # private rbmk checkout needs.

      - name: Checkout rbmk generators
        uses: actions/checkout@v7
        with:
          repository: chainswarm/rbmk
          ref: main
          path: .rbmk
          # rbmk is private; the caller's scoped GITHUB_TOKEN cannot read it.
          # Use the chainswarm-ci App installation token (org-scoped). The
          # mint step above has no continue-on-error guard, so this step is
          # only ever reached with a populated app-token output — org App
          # secrets are assumed always present, not optionally missing.
          token: ${{ steps.app-token.outputs.token || github.token }}

      - name: README golden-standard lint (report-only for now)
        run: python3 .rbmk/scripts/devops/check-readme-standard.py --repo-root . --warn-only

      - name: Render C4 diagrams (no-op when none)
        env:
          DIAGRAM_REPO_ROOT: ${{ github.workspace }}
        run: bash .rbmk/scripts/devops/render-architecture-diagrams.sh

      - name: Generate GSD architecture bundle (ARCHITECTURE.md, links rendered diagrams)
        # Runs AFTER render so the C4 Diagrams section links the freshly-rendered SVGs.
        run: python3 .rbmk/scripts/devops/generate-gsd-architecture.py --single-repo-root "$GITHUB_WORKSPACE"

      - name: Ensure claude CLI is on PATH
        # claude CLI is installed per-machine by the operator (same as
        # codex/composer -- see rbmk's moa-pr-review-reusable.yml's
        # equivalent step), typically under ~/.local/bin via a symlink
        # into ~/.claude/. The installer only updates .bashrc for future
        # interactive shells, not the current or later job steps, so this
        # just persists the known location to $GITHUB_PATH. If a runner
        # machine hasn't been bootstrapped yet, this is a no-op and the
        # next step fails loudly with "claude: command not found" rather
        # than silently.
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Refresh knowledge skill (validated, direct-commit)
        # The proposing agent has Read/Grep/Glob only (--tools, --safe-mode)
        # — it can look at the repo and the commit log since the skill was
        # last touched, but it can only emit text, never write a file. A
        # deterministic validator (validate-knowledge-skill-proposal.py)
        # checks the proposal before anything touches disk, and an
        # isolation check confirms nothing else changed. See rbmk's
        # docs/architecture/decisions/2026-07-05-knowledge-skill-autorefresh.md
        # for the two cross-model review rounds (one `stop`, one `revise`)
        # this design went through before landing here.
        if: always()
        run: python3 .rbmk/scripts/devops/refresh-knowledge-skill.py --repo-root "$GITHUB_WORKSPACE"

      - name: Commit generated docs back to the repo
        run: |
          rm -rf .rbmk
          git add docs/architecture
          # Force-add the rendered diagram tree so committed PNGs survive a
          # repo-level `*.png` .gitignore. ARCHITECTURE.md embeds the PNG (GitHub
          # web refuses to inline-render repo SVGs), so the PNG must be tracked or
          # the embed 404s. SVG/puml in the same tree are added either way.
          git add -f docs/architecture/diagrams/rendered 2>/dev/null || true
          # generate-gsd-architecture.py also writes two paths outside
          # docs/architecture: it rewrites the `<!-- gsd: workers -->` region
          # of README.md (inject_readme_worker_table) and scaffolds
          # docs/acceptance/<component>.md for newly-discovered components
          # (scaffold_acceptance_docs). Both are legitimate generated content
          # meant to land in this same commit, not accidental noise -- stage
          # them explicitly by exact path (never a blanket stage-everything
          # add). Found live in production (chainswarm/indexer-ln, run
          # 28753502077): the
          # commit step staged 18 docs/architecture files and committed
          # successfully, but the subsequent `git pull --rebase` failed with
          # "You have unstaged changes" because a run that discovered new
          # components left README.md's worker table modified and new
          # docs/acceptance/*.md files untracked -- neither covered by the
          # git add calls above. Reproduced locally against the same repo
          # checkout: `git status --short` after generate-gsd-architecture.py
          # showed exactly ` M README.md` plus `?? docs/acceptance/*.md`.
          git add README.md 2>/dev/null || true
          git add docs/acceptance 2>/dev/null || true
          # Stage the knowledge skill only if the refresh step actually
          # changed it — never a bare `git add skills/` or `git add -A`.
          if [ -n "$(git status --porcelain -- 'skills/rbmk-*-knowledge/SKILL.md' 2>/dev/null)" ]; then
            git add -- 'skills/rbmk-*-knowledge/SKILL.md'
          fi
          if git diff --cached --quiet; then
            echo "No docs/architecture changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: regenerate architecture via rbmk docs subsystem [skip ci]"

          push_attempt() {
            git pull --rebase origin "${GITHUB_REF_NAME}" && \
              git push origin "HEAD:${GITHUB_REF_NAME}"
          }
          if ! push_attempt; then
            echo "push/rebase failed once, retrying"
            if ! push_attempt; then
              echo "::error::push/rebase failed twice, giving up"
              exit 1
            fi
          fi

name: Docs

# Chain Insights owns this validation. The README lint lives in this
# repository. The workflow never fetches another repo or writes to protected
# branches. The C4 render step went with the generated diagrams (0.58.4): the
# architecture diagram is hand-written Mermaid in docs/architecture/ARCHITECTURE.md.
on:
  schedule:
    - cron: '5 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Validate repository docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: README documentation lint
        run: python3 scripts/docs/check-readme-standard.py --repo-root .


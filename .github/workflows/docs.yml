name: Docs

# Chain Insights owns this validation. Architecture docs and their rendering
# helpers live in this repository. The workflow never fetches another repo or
# writes to protected branches.
on:
  schedule:
    - cron: '5 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Validate repository docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: README documentation lint
        run: python3 scripts/docs/check-readme-standard.py --repo-root .

      - name: Render C4 diagrams
        run: bash scripts/docs/render-architecture-diagrams.sh

      - name: Verify rendered docs are committed
        run: |
          if ! git diff --exit-code -- docs/architecture; then
            echo "::error::Rendered architecture docs are stale. Regenerate and commit them in this repository."
            exit 1
          fi

name: Docs

# Thin caller for the RBMK docs subsystem. Logic lives once in
# chainswarm/rbmk/.github/workflows/docs-reusable.yml (Approach A — no per-repo drift).
# Nightly only: render/lint is cheap, but every-push still burned runner queue.
# Manual: workflow_dispatch when you need a fresh render now.
on:
  schedule:
    - cron: "45 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  docs:
    uses: chainswarm/rbmk/.github/workflows/docs-reusable.yml@main
    secrets: inherit

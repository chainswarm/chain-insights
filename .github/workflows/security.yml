name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "21 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: npm Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --audit=false --fund=false

      - name: Verify npm registry signatures
        run: npm audit signatures

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Audit all dependencies for high severity issues
        run: npm audit --audit-level=high

  secret-patterns:
    name: Secret Pattern Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Scan tracked files for high-confidence secrets
        run: |
          set -euo pipefail
          pattern='(0x[0-9a-fA-F]{64}|eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+|\b(ghp|github_pat|xox[baprs]|AKIA|ASIA|sk|pk|rk)[_-][A-Za-z0-9_-]{16,}\b)'
          if git grep -n -I -E "$pattern" -- \
            . \
            ':(exclude)package-lock.json' \
            ':(exclude)tests/**'; then
            echo "::error::High-confidence secret-looking value found in tracked files."
            exit 1
          fi

      - name: Detect indirect secret egress patterns in changed files
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail

          base_sha='${{ github.event.pull_request.base.sha }}'
          head_sha='${{ github.event.pull_request.head.sha }}'

          git fetch --no-tags --prune --depth=1 origin "$base_sha" "$head_sha"

          mapfile -d '' changed_files < <(
            git diff --name-only -z "$base_sha...$head_sha" -- \
              '*.js' '*.jsx' '*.ts' '*.tsx' '*.mjs' '*.cjs' '*.sh' '*.yml' '*.yaml'
          )

          if [ "${#changed_files[@]}" -eq 0 ]; then
            echo "No eligible code file changes in this PR."
            exit 0
          fi

          declare -A aliases=()
          assign_pattern='^\\s*[A-Za-z_][A-Za-z0-9_]*[[:space:]]*=.*\\$\\{?(GITHUB_TOKEN|NPM_TOKEN|NODE_AUTH_TOKEN|AWS_SECRET_ACCESS_KEY|API_KEY|PRIVATE_KEY|AUTH_TOKEN|SECRETS?|TOKEN|KEY|SECRET)\\}?'

          for f in "${changed_files[@]}"; do
            [ -f "$f" ] || continue

            while IFS= read -r name; do
              aliases["$name"]=1
            done < <(
              rg -o -N -P "${assign_pattern}" "$f" |
                sed -nE 's/^\s*([A-Za-z_][A-Za-z0-9_]*)\s*=.*/\1/p' | sort -u
            )

            if ((${#aliases[@]} > 0)); then
              for alias in "${!aliases[@]}"; do
                if rg -n -P "(^|[[:space:]])(echo|cat|printf|tee|node|python|bash|sh|curl|wget)\\s+.*\\$${alias}(\\b|[[:space:]]|\\}|\"|'|\)|\\$)" "$f" >/dev/null; then
                  echo "::error::Potential indirect secret egress in $f: variable '$alias' appears in command output path after assignment from secret source."
                  exit 1
                fi
              done
            fi
          done

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4
        with:
          category: "/language:javascript-typescript"

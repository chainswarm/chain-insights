name: Security

# Weekly and on dispatch only (operator ruling 2026-10-04, D1): the push and
# pull request triggers moved to the local merge gate, which runs ci/lint.sh
# (the secret scans) on the agent's host. `gh workflow run security.yml`.
on:
  schedule:
    - cron: '21 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: npm Audit
    runs-on: [self-hosted, chainswarm-runner, X64]
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          # No Actions cache for npm: the runners are self-hosted and keep ~/.npm, and
          # restoring the saved archive (5.2 GB on 2026-10-02) took longer than the
          # job's 20-minute limit.

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --audit=false --fund=false

      - name: Verify npm registry signatures
        run: npm audit signatures

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Audit all dependencies for high severity issues
        run: npm audit --audit-level=high

  secret-patterns:
    name: Secret Pattern Scan (ci/lint.sh)
    runs-on: [self-hosted, chainswarm-runner, X64]
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The egress scan diffs origin/main...HEAD.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: lint
        run: bash ci/lint.sh

  codeql:
    name: CodeQL
    runs-on: [self-hosted, chainswarm-runner, X64]
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: '/language:javascript-typescript'

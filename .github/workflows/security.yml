name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "21 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: npm Audit
    runs-on: [self-hosted, chainswarm-runner, X64]
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --audit=false --fund=false

      - name: Verify npm registry signatures
        run: npm audit signatures

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Audit all dependencies for high severity issues
        run: npm audit --audit-level=high

  secret-patterns:
    name: Secret Pattern Scan
    runs-on: [self-hosted, chainswarm-runner, X64]
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan tracked files for high-confidence secrets
        run: |
          set -euo pipefail
          pattern='(0x[0-9a-fA-F]{64}|eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+|\b(ghp|github_pat|xox[baprs]|AKIA|ASIA|sk|pk|rk)[_-][A-Za-z0-9_-]{16,}\b)'
          # Keep the scan broad enough to cover tests, but exempt the small set of
          # fixtures that intentionally contain fake secret-shaped values.
          if git grep -n -I -E "$pattern" -- \
            . \
            ':(exclude)package-lock.json' \
            ':(exclude)tests/cli-mcp.test.ts' \
            ':(exclude)tests/mcp-client.test.ts' \
            ':(exclude)tests/mcp-proxy.test.ts' \
            ':(exclude)tests/wallet.test.ts' \
            ':(exclude)tests/wallet-tools.test.ts'; then
            echo "::error::High-confidence secret-looking value found in tracked files."
            exit 1
          fi

      - name: Detect secret egress patterns in changed files
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail

          base_sha='${{ github.event.pull_request.base.sha }}'
          head_sha='${{ github.event.pull_request.head.sha }}'

          git fetch --no-tags --prune --depth=1 origin "$base_sha" "$head_sha"

          mapfile -d '' changed_files < <(
            git diff --name-only -z "$base_sha...$head_sha" -- \
              '*.js' '*.jsx' '*.ts' '*.tsx' '*.mjs' '*.cjs' '*.sh' '*.yml' '*.yaml'
          )

          if [ "${#changed_files[@]}" -eq 0 ]; then
            echo "No eligible code file changes in this PR."
            exit 0
          fi

          egress_pattern='console\.(log|error|warn|info|debug|trace)\s*\(.*(process\.env|secret|token|key|password|private_key)'
          egress_pattern+="|(^|[[:space:]])(echo|cat|printf)\s+.*\$\{?(GITHUB_TOKEN|NPM_TOKEN|NODE_AUTH_TOKEN|AWS_SECRET_ACCESS_KEY|API_KEY|PRIVATE_KEY|AUTH_TOKEN|SECRETS?)\}?" 

          for f in "${changed_files[@]}"; do
            [ -f "$f" ] || continue
            if rg -n -E "$egress_pattern" "$f"; then
              echo "::error::Potential secret-evasion output pattern in $f"
              exit 1
            fi
          done

  codeql:
    name: CodeQL
    runs-on: [self-hosted, chainswarm-runner, X64]
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Initialize CodeQL
        uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          category: "/language:javascript-typescript"

name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "21 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: npm Audit
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'chainswarm-runner' }}
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --audit=false --fund=false

      - name: Verify npm registry signatures
        run: npm audit signatures

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Audit all dependencies for high severity issues
        run: npm audit --audit-level=high

  secret-patterns:
    name: Secret Pattern Scan
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'chainswarm-runner' }}
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Scan tracked files for high-confidence secrets
        run: |
          set -euo pipefail
          pattern='(0x[0-9a-fA-F]{64}|eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+|\b(ghp|github_pat|xox[baprs]|AKIA|ASIA|sk|pk|rk)[_-][A-Za-z0-9_-]{16,}\b)'
          # Keep the scan broad enough to cover tests, but exempt the small set of
          # fixtures that intentionally contain fake secret-shaped values.
          if git grep -n -I -E "$pattern" -- \
            . \
            ':(exclude)package-lock.json' \
            ':(exclude)tests/cli-mcp.test.ts' \
            ':(exclude)tests/mcp-client.test.ts' \
            ':(exclude)tests/mcp-proxy.test.ts' \
            ':(exclude)tests/wallet.test.ts' \
            ':(exclude)tests/wallet-tools.test.ts'; then
            echo "::error::High-confidence secret-looking value found in tracked files."
            exit 1
          fi

  codeql:
    name: CodeQL
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'chainswarm-runner' }}
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4
        with:
          category: "/language:javascript-typescript"

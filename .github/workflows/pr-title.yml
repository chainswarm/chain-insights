name: PR Title

# Dispatch only (operator ruling 2026-10-04, D1). A dispatched run checks
# the title it is given: `gh workflow run pr-title.yml -f title='<title>'`.
on:
  workflow_dispatch:
    inputs:
      title:
        description: The pull request title to check
        required: true
        type: string

permissions:
  pull-requests: read

jobs:
  conventional-title:
    name: Conventional commit title
    runs-on: [self-hosted, chainswarm-runner, X64]
    timeout-minutes: 5
    steps:
      - name: Check PR title
        env:
          PR_TITLE: ${{ inputs.title }}
        run: |
          set -euo pipefail
          pattern='^(feat|fix|docs|chore|ci|refactor|perf|test|build|revert)(\([^)]+\))?!?: .+'
          if [[ "$PR_TITLE" =~ $pattern ]]; then
            echo "Title OK: $PR_TITLE"
          else
            echo "::error::PR title must be a conventional commit: <type>(<scope>): <summary>."
            echo "::error::Allowed types: feat fix docs chore ci refactor perf test build revert."
            echo "::error::Got: $PR_TITLE"
            exit 1
          fi

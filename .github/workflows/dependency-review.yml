name: Dependency Review

# Dispatch only (operator ruling 2026-10-04, D1). The action compares two
# refs; a dispatched run names them. `gh workflow run dependency-review.yml
# --ref <branch> -f head-ref=<branch>`.
on:
  workflow_dispatch:
    inputs:
      base-ref:
        description: Base ref to compare against
        required: true
        default: main
        type: string
      head-ref:
        description: Head ref whose dependency changes are reviewed
        required: true
        type: string

permissions:
  contents: read

jobs:
  dependency-review:
    name: Review dependency changes
    runs-on: [self-hosted, chainswarm-runner, X64]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          base-ref: ${{ inputs.base-ref }}
          head-ref: ${{ inputs.head-ref }}

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  draft-release:
    name: Tag + draft GitHub Release
    runs-on: [self-hosted, chainswarm-runner, X64]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Resolve version and tag state
        id: rel
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip when tag already exists
        if: steps.rel.outputs.exists == 'true'
        run: echo "Tag ${{ steps.rel.outputs.tag }} already exists; nothing to do."

      - name: Create tag
        if: steps.rel.outputs.exists == 'false'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.rel.outputs.tag }}" -m "Release ${{ steps.rel.outputs.tag }}"
          git push origin "${{ steps.rel.outputs.tag }}"

      - name: Generate CycloneDX SBOM
        if: steps.rel.outputs.exists == 'false'
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json

      - name: Create draft release
        if: steps.rel.outputs.exists == 'false'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: ${{ steps.rel.outputs.tag }}
          draft: true
          generate_release_notes: true
          files: sbom.cyclonedx.json
        # Draft on purpose: a human reviews generated notes and publishes.
        # Never set draft: false — the npm publish gate stays manual in
        # chainswarm/chain-insights-publisher.

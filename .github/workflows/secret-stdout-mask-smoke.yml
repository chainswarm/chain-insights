name: Secret stdout mask smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-mask:
    name: Verify secret redaction in logs
    runs-on: [self-hosted, chainswarm-runner, X64]
    steps:
      - name: Print GitHub token
        env:
          TEST_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Trying to leak token (should be masked):"
          echo "$TEST_TOKEN"
          echo "Token in text: $TEST_TOKEN"
          printf 'printf-token=%s\n' "$TEST_TOKEN"

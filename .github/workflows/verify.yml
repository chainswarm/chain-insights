name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, Test, Build, Pack
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'chainswarm-runner' }}
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --audit=false --fund=false

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Check release metadata
        if: github.event_name == 'pull_request'
        run: npm run release:check

      - name: Test
        run: npm test

      - name: Verify npm package contents
        run: |
          set -euo pipefail
          # `npm pack` runs the `prepare` lifecycle script (tsdown build);
          # that child process's stdout is not silenced by --silent and is
          # interleaved with npm's own printed tarball filename. The tarball
          # filename is always npm's own final line of output, so take the
          # last line rather than the whole capture.
          package_file="$(npm pack --silent | tail -n1)"
          tar -tf "$package_file"
          rm "$package_file"

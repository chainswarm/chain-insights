name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, Test, Build, Pack
    runs-on: [self-hosted, chainswarm-runner, X64]
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # check-release-gate.mjs diffs origin/main...HEAD; a default
          # shallow (depth 1) checkout has no merge base with a detached
          # HEAD, so its own `git fetch --depth=1 origin main` can't
          # establish one either. Repo is small -- full history is cheap.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --audit=false --fund=false

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Detect release-bearing changes
        if: github.event_name == 'pull_request'
        id: release-scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if git diff --quiet "$BASE_SHA...$HEAD_SHA" -- . ':(exclude).github/**'; then
            echo "required=false" >> "$GITHUB_OUTPUT"
          else
            echo "required=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check release metadata
        if: github.event_name == 'pull_request' && steps.release-scope.outputs.required == 'true'
        run: npm run release:check

      - name: Test
        run: npm test

      - name: Verify npm package contents
        run: |
          set -euo pipefail
          # `npm pack` runs the `prepare` lifecycle script (tsdown build);
          # that child process's stdout is not silenced by --silent and is
          # interleaved with npm's own printed tarball filename. The tarball
          # filename is always npm's own final line of output, so take the
          # last line rather than the whole capture.
          package_file="$(npm pack --silent | tail -n1)"
          tar -tf "$package_file"
          rm "$package_file"

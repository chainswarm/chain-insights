name: Verify

# Three tiers, each one file under ci/, the same file the local merge gate
# runs on the agent's host (AP1000 change local-ci-gate, C1):
#
#   T1     ci/t1.sh     typecheck, build, vitest with coverage   180 s
#   T2     ci/t2.sh     vitest t2 project against anvil          600 s
#   lint   ci/lint.sh   oxlint, secret pattern scan, egress scan 120 s
#   build  ci/build.sh  build, publint, attw, release gate, pack
#
# A tier prints "<TIER> test phase: <n>s (budget <m>s)" and fails over its
# budget. ci/manifest.json names the tiers.
#
# This workflow runs on workflow_dispatch only (operator ruling 2026-10-04,
# D1): the merge gate is the local receipt; a dispatched run is the second
# opinion. `gh workflow run verify.yml --ref <branch>`.

# The merge gate is GitHub Actions on the build host (AP1000 change
# build-host-and-shared-qmd, aphex5 2026-10-14 "actions only"): this workflow
# runs on every pull request and every push to main, on the ms-a2-1 runners,
# and branch protection requires its check. The local receipt of 2026-10-04 is
# retired; the comment above that names it is history.
# A pull request from a fork never runs on our own machines (security report
# of 2026-11-10): this repository is public, and a stranger's code on a
# persistent self-hosted runner can stay there and read what later jobs use.
# Every job below picks its machine by where the pull request comes from: a
# fork gets a GitHub-hosted machine that is thrown away after the job; our own
# branches and main keep the build host. Never give a job in this file a plain
# self-hosted `runs-on`.
on:
  # Tests run before an image build, never on a pull request or a push
  # (operator ruling 2026-11-11, AP1000 AGENTS.md "Tests run before a release").
  workflow_dispatch:

  workflow_call:

permissions:
  contents: read

jobs:
  t1:
    name: T1 (typecheck, build, test)
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || fromJSON('["self-hosted","chainswarm-runner","X64"]') }}
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # No Actions cache for npm: the runners are self-hosted and keep ~/.npm, and
          # restoring the saved archive (5.2 GB on 2026-10-02) took longer than the
          # job's 20-minute limit.

      # The served exchange registry equals its reviewed table, and the skill
      # memo equals the served copy (registry/README.md). No install needed.
      - name: Exchange registry pin
        run: |
          node scripts/pin-dex-registry.mjs --check registry/robinhood.md
          node scripts/render-dex-registry.mjs --check

      - name: T1
        run: bash ci/t1.sh

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-lcov
          path: .ci/t1/lcov.info
          if-no-files-found: ignore

  t2:
    name: T2 (anvil)
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || fromJSON('["self-hosted","chainswarm-runner","X64"]') }}
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: T2
        run: bash ci/t2.sh

  lint:
    name: lint
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || fromJSON('["self-hosted","chainswarm-runner","X64"]') }}
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The egress scan diffs origin/main...HEAD.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: lint
        run: bash ci/lint.sh

  build:
    name: Build, Pack
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || fromJSON('["self-hosted","chainswarm-runner","X64"]') }}
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # check-release-gate.mjs diffs origin/main...HEAD; a default
          # shallow (depth 1) checkout has no merge base with a detached
          # HEAD, so its own `git fetch --depth=1 origin main` can't
          # establish one either. Repo is small -- full history is cheap.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: build
        run: bash ci/build.sh
